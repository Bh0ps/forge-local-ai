services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
  interface:
    build:
      context: .
      dockerfile: Dockerfile.model_manager
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      OLLAMA_API_BASE: http://ollama:11434/api
      BIND_HOST: 0.0.0.0
      SIDEKICK_DATA_DIR: /data
      SIDEKICK_PROJECTS_ROOT: /workspace
    volumes:
      - sidekick-data:/data
      - ${SIDEKICK_WORKSPACE:-./workspace}:/workspace
    depends_on:
      - ollama
    restart: unless-stopped
volumes:
  ollama-models:
  sidekick-data:
