name: forge

services:
  forge:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      FORGE_DATA_DIR: /data
      FORGE_PROJECTS_ROOT: /workspace
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://ollama:11434/api}
      FORGE_ALLOWED_HOSTS: localhost,127.0.0.1
      TZ: ${TZ:-Europe/Dublin}
    volumes:
      - forge-state:/data
      - type: bind
        source: ${FORGE_WORKSPACE:-./workspace}
        target: /workspace
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
      - /home/forge/.cache:size=134217728,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  ollama:
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11434"
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama-models:/root/.ollama

  vllm:
    profiles: [vllm]
    image: vllm/vllm-openai:v0.31.0@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
    gpus: all
    shm_size: 2gb
    ports:
      - "127.0.0.1:8301:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - hf-models:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    command: ["--model", "${FORGE_HF_MODEL:-Qwen/Qwen3-0.6B}", "--host", "0.0.0.0", "--port", "8000", "--max-model-len", "${FORGE_ENGINE_CONTEXT:-32768}", "--gpu-memory-utilization", "${FORGE_GPU_MEMORY_FRACTION:-0.85}"]

  sglang:
    profiles: [sglang]
    image: lmsysorg/sglang:v0.5.21@sha256:b1259f3ea3275f66237c498ea388919729018bc9f01c3d638391e06e2cf3f469
    gpus: all
    shm_size: 2gb
    ports:
      - "127.0.0.1:8302:30000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      DO_NOT_TRACK: "1"
    volumes:
      - hf-models:/root/.cache/huggingface
    entrypoint: [python3, -m, sglang.launch_server]
    command: ["--model-path", "${FORGE_HF_MODEL:-Qwen/Qwen3-0.6B}", "--host", "0.0.0.0", "--port", "30000", "--context-length", "${FORGE_ENGINE_CONTEXT:-32768}", "--mem-fraction-static", "${FORGE_GPU_MEMORY_FRACTION:-0.85}"]

  llama-cuda:
    profiles: [llama-cuda]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-v0.5.0@sha256:52192a23c7b258044463aebba78826cdff39a7393b713edc313324b343a7b836
    gpus: all
    ports:
      - "127.0.0.1:8303:8080"
    volumes:
      - type: bind
        source: ${FORGE_GGUF_DIRECTORY:-./models}
        target: /models
        read_only: true
    command: ["--model", "/models/${FORGE_GGUF_FILE:-model.gguf}", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "${FORGE_ENGINE_CONTEXT:-32768}", "--n-gpu-layers", "999", "--jinja", "--parallel", "1"]

volumes:
  forge-state:
  ollama-models:
  hf-models:
  vllm-cache:
